[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infoflowaggregator-backend"
version = "3.3.1"
description = "FastAPI backend for InfoFlowAggregator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.15,<2.0",
  "greenlet>=3.1.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "cryptography>=42.0,<47.0",
  "defusedxml>=0.7,<1.0",
  "crawl4ai==0.8.6",
  "playwright>=1.59,<2.0",
  "trafilatura>=2.0,<3.0",
  "readability-lxml>=0.8.4.1,<0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-xdist>=3.6,<4.0",
  "ruff>=0.8,<1.0",
  "testcontainers[postgres]>=4.10,<5.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.capture_tools" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: integration tests that require Docker and a postgres:16 test container",
  "file_sqlite: tests that need separate SQLite connections, usually for real background threads",
]
